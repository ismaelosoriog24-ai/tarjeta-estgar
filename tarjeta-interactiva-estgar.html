<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071A32">
  <title>Ismael Osorio G · Estgar Studio</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700;800&display=swap');
    :root{--navy:#071A32;--blue:#3189cf;--ice:#c4daef}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;overflow:hidden;padding:24px;color:#fff;background:#041325;font-family:'Work Sans',Arial,sans-serif}.orb{position:fixed;border-radius:50%;pointer-events:none;filter:blur(1px);opacity:.7}.one{width:380px;height:380px;top:-150px;right:-80px;background:#174b7b;animation:float-one 12s ease-in-out infinite alternate}.two{width:260px;height:260px;bottom:-90px;left:-65px;background:#123b63;animation:float-two 10s ease-in-out infinite alternate}.three{width:74px;height:74px;top:24%;right:13%;background:#2a7dbc;opacity:.23;animation:float-three 7s ease-in-out infinite alternate}@keyframes float-one{to{transform:translate(-80px,68px) scale(1.14)}}@keyframes float-two{to{transform:translate(105px,-66px) scale(.9)}}@keyframes float-three{to{transform:translate(-48px,82px) scale(1.5)}}main{position:relative;isolation:isolate;width:min(100%,700px);min-height:690px;overflow:hidden;padding:48px;border:1px solid rgba(178,220,250,.18);border-radius:26px;background:linear-gradient(145deg,rgba(11,38,68,.98),rgba(5,21,42,.99));box-shadow:0 28px 70px rgba(0,0,0,.48)}main::before{content:"";position:absolute;inset:0;z-index:-2;background:linear-gradient(120deg,transparent 60%,rgba(48,137,207,.08))}.watermark{position:absolute;z-index:-1;width:120%;left:-11%;top:35%;opacity:.07;transform:rotate(-11deg)}.brand{width:235px;display:block}.line{width:72px;height:5px;margin:58px 0 27px;background:var(--blue)}h1{margin:0;font-size:clamp(34px,7vw,50px);line-height:1.04;letter-spacing:.02em}.roles{margin:20px 0 40px;color:var(--ice);font-size:clamp(16px,3vw,20px);line-height:1.65}.tagline{margin:0 0 38px;color:#7fc1f0;font-size:13px;font-weight:700;letter-spacing:.11em}.actions{display:grid;grid-template-columns:1fr 1fr;gap:11px}a,button{min-height:52px;border-radius:11px;border:1px solid rgba(201,219,237,.2);color:#fff;background:rgba(17,58,96,.72);padding:0 12px;font:600 15px 'Work Sans',Arial,sans-serif;text-decoration:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .18s ease,background .18s ease,box-shadow .18s ease}a:hover,button:hover{transform:translateY(-2px);background:#174d7e;box-shadow:0 8px 20px rgba(0,0,0,.18)}.primary{grid-column:span 2;border:0;background:var(--blue)}.primary:hover{background:#439be0}.contact{margin-top:33px;padding-top:21px;border-top:1px solid rgba(201,219,237,.17);color:var(--ice);display:grid;gap:8px;font-size:14px}@media(max-width:500px){body{padding:0}main{min-height:100vh;border-radius:0;padding:42px 28px}.actions{grid-template-columns:1fr}.primary{grid-column:auto}}
  </style>
</head>
<body>
  <div class="orb one"></div><div class="orb two"></div><div class="orb three"></div>
  <main>
    <img class="watermark" src="logo-estgar-blanco.png" alt="">
    <img class="brand" src="logo-estgar-blanco.png" alt="Estgar Studio">
    <div class="line"></div><h1>Ismael<br>Osorio G</h1>
    <p class="roles">Programador y Diseñador Web<br>Técnico en Sonido y Producción Musical</p>
    <p class="tagline">SOLUCIONES DIGITALES / AUDIO / PRODUCCIÓN</p>
    <section class="actions" aria-label="Acciones de contacto">
      <a class="primary" href="https://wa.me/56965982665" target="_blank" rel="noopener">Enviar WhatsApp</a>
      <a href="mailto:estgarstudio@gmail.com?subject=Consulta%20para%20Estgar%20Studio">Enviar correo</a><a href="https://www.instagram.com/estgarstudio.2026/" target="_blank" rel="noopener">Ver Instagram</a>
      <a href="https://estgarstudio.netlify.app/" target="_blank" rel="noopener">Visitar página web</a>
      <button type="button" id="contact">Guardar contacto</button><button type="button" id="share">Compartir tarjeta</button>
    </section>
    <div class="contact"><span>+56 9 6598 2665</span><span>estgarstudio@gmail.com</span><span>estgarstudio.netlify.app</span></div>
  </main>
  <script>
    const vcard=`BEGIN:VCARD\nVERSION:3.0\nFN:Ismael Osorio G\nORG:Estgar Studio\nTITLE:Programador y Diseñador Web; Técnico en Sonido y Producción Musical\nTEL;TYPE=CELL:+56965982665\nEMAIL:estgarstudio@gmail.com\nURL:https://estgarstudio.netlify.app/\nX-SOCIALPROFILE;TYPE=instagram:https://www.instagram.com/estgarstudio.2026/\nEND:VCARD`;
    document.querySelector('#contact').addEventListener('click',()=>{const file=new Blob([vcard],{type:'text/vcard'});const link=Object.assign(document.createElement('a'),{href:URL.createObjectURL(file),download:'Ismael-Osorio-Estgar-Studio.vcf'});link.click();URL.revokeObjectURL(link.href)});
    document.querySelector('#share').addEventListener('click',async()=>{if(navigator.share)await navigator.share({title:'Estgar Studio',text:'Tarjeta de presentación de Ismael Osorio G'});else alert('Comparte este archivo junto al logo de Estgar Studio.')});
  </script>
</body>
</html>
