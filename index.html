<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E293B">
<meta name="description" content="Tarjeta digital interactiva de ESTGAR Studio">
<title>ESTGAR Studio · Tarjeta Digital</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap');

:root {
  --bg:#0b1119;
  --card:#1E293B;
  --card2:#172232;
  --white:#ffffff;
  --muted:#b8c2cf;
  --line:rgba(255,255,255,.16);
  --soft:rgba(255,255,255,.07);
  --radius:28px;
  --ail:'Ailerons','Montserrat',Arial,sans-serif;
}

* { box-sizing:border-box; }

html {
  min-height:100%;
  background:var(--bg);
  scroll-behavior:smooth;
}

body {
  margin:0;
  min-height:100%;
  padding:24px 16px;
  background:
    radial-gradient(circle at 50% 0%, rgba(255,255,255,.08), transparent 35%),
    var(--bg);
  color:var(--white);
  font-family:'Montserrat',Arial,sans-serif;
  overflow-x:hidden;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}

button,a { -webkit-tap-highlight-color:transparent; }

.wrap {
  width:100%;
  max-width:480px;
  margin:0 auto;
}

.card {
  width:100%;
  min-height:calc(100dvh - 48px);
  background:linear-gradient(145deg,var(--card),#14202e);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:0 24px 80px rgba(0,0,0,.45);
  padding:30px;
  position:relative;
  overflow:hidden;
}

.card::before {
  content:"";
  position:absolute;
  width:260px;
  height:260px;
  right:-130px;
  top:-130px;
  border:1px solid rgba(255,255,255,.10);
  border-radius:50%;
}

.card::after {
  content:"";
  position:absolute;
  width:180px;
  height:180px;
  left:-110px;
  bottom:130px;
  border:1px solid rgba(255,255,255,.06);
  border-radius:50%;
}

.content { position:relative; z-index:1; }

.top {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
  padding-bottom:24px;
  border-bottom:1px solid var(--line);
}


.logo-stage{
  position:relative;
  width:min(290px,82%);
  height:105px;
  display:flex;
  align-items:center;
  justify-content:flex-start;
  overflow:visible;
}
.logo-stage::before{
  content:"";
  position:absolute;
  width:150px;
  height:150px;
  left:22px;
  top:50%;
  transform:translate(-50%,-50%);
  border:1px solid rgba(255,255,255,.10);
  border-radius:50%;
  animation:pulseRing 4s ease-in-out infinite;
}
.logo-glow{
  position:absolute;
  left:10px;
  top:50%;
  width:125px;
  height:125px;
  transform:translateY(-50%);
  border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.17),rgba(255,255,255,.03) 45%,transparent 72%);
  filter:blur(5px);
  animation:logoGlow 3s ease-in-out infinite;
}
.logo-orbit{
  position:absolute;
  left:12px;
  top:50%;
  width:145px;
  height:38px;
  border:1px solid rgba(255,255,255,.16);
  border-radius:50%;
  transform:translateY(-50%) rotate(-18deg);
}
.orbit-a{ animation:orbitA 5s linear infinite; }
.orbit-b{
  width:155px;
  height:45px;
  transform:translateY(-50%) rotate(55deg);
  border-color:rgba(255,255,255,.08);
  animation:orbitB 7s linear infinite;
}
.logo{
  position:relative;
  z-index:3;
  width:min(230px,100%);
  height:auto;
  display:block;
  opacity:.88;
  filter:drop-shadow(0 0 18px rgba(255,255,255,.12));
  animation:logoFloat 4s ease-in-out infinite;
}
@keyframes logoFloat{
  0%,100%{transform:translateY(0) scale(1);opacity:.78}
  50%{transform:translateY(-5px) scale(1.025);opacity:.96}
}
@keyframes logoGlow{
  0%,100%{transform:translateY(-50%) scale(.86);opacity:.45}
  50%{transform:translateY(-50%) scale(1.12);opacity:.9}
}
@keyframes pulseRing{
  0%,100%{transform:translate(-50%,-50%) scale(.85);opacity:.25}
  50%{transform:translate(-50%,-50%) scale(1.12);opacity:.75}
}
@keyframes orbitA{
  from{transform:translateY(-50%) rotate(-18deg)}
  to{transform:translateY(-50%) rotate(342deg)}
}
@keyframes orbitB{
  from{transform:translateY(-50%) rotate(55deg)}
  to{transform:translateY(-50%) rotate(-305deg)}
}

.logo {
  width:min(230px,65%);
  height:auto;
  display:block;
}

.status {
  font-size:9px;
  letter-spacing:2px;
  text-transform:uppercase;
  color:var(--muted);
  text-align:right;
  white-space:nowrap;
}

.hero {
  padding:42px 0 34px;
}

.kicker {
  font-family:var(--ail);
  font-size:12px;
  letter-spacing:4px;
  color:#d9e0e8;
  margin:0 0 15px;
  text-transform:uppercase;
}

.name {
  margin:0;
  font-family:var(--ail);
  font-size:clamp(38px,10vw,58px);
  line-height:.95;
  letter-spacing:3px;
  font-weight:400;
}

.role {
  margin:17px 0 0;
  color:var(--muted);
  font-size:13px;
  line-height:1.7;
}

.divider {
  width:70px;
  height:1px;
  background:var(--white);
  opacity:.75;
  margin:28px 0;
}

.tagline {
  margin:0;
  font-family:var(--ail);
  font-size:12px;
  letter-spacing:3px;
  line-height:1.9;
  color:#e8edf2;
}

.actions {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.action {
  min-height:54px;
  border:1px solid var(--line);
  border-radius:15px;
  background:var(--soft);
  color:var(--white);
  text-decoration:none;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  font-size:11px;
  font-weight:600;
  letter-spacing:.8px;
  transition:transform .2s ease,background .2s ease,border-color .2s ease;
  cursor:pointer;
}

.action:hover {
  transform:translateY(-2px);
  background:rgba(255,255,255,.12);
  border-color:rgba(255,255,255,.35);
}

.action:active { transform:scale(.98); }

.action.primary {
  grid-column:1/-1;
  background:var(--white);
  color:var(--card);
  border-color:var(--white);
}

.icon {
  width:18px;
  height:18px;
  display:grid;
  place-items:center;
  font-size:15px;
}

.info {
  margin-top:26px;
  padding-top:24px;
  border-top:1px solid var(--line);
  display:grid;
  gap:13px;
}

.info-row {
  display:flex;
  align-items:center;
  gap:13px;
  color:var(--muted);
  font-size:12px;
  line-height:1.4;
}

.info-row strong {
  color:var(--white);
  font-weight:500;
}

.info-icon {
  width:34px;
  height:34px;
  flex:0 0 34px;
  border:1px solid var(--line);
  border-radius:10px;
  display:grid;
  place-items:center;
  color:var(--white);
}

.footer {
  margin-top:28px;
  padding-top:18px;
  border-top:1px solid var(--line);
  display:flex;
  justify-content:space-between;
  gap:15px;
  color:#93a1b1;
  font-size:9px;
  letter-spacing:2px;
  text-transform:uppercase;
}

.toast {
  position:fixed;
  left:50%;
  bottom:22px;
  transform:translate(-50%,20px);
  background:#fff;
  color:#1E293B;
  padding:12px 18px;
  border-radius:999px;
  font-size:11px;
  font-weight:700;
  opacity:0;
  pointer-events:none;
  transition:.25s ease;
  z-index:10;
  white-space:nowrap;
}

.toast.show {
  opacity:1;
  transform:translate(-50%,0);
}

@media (min-width:700px) {
  body {
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px;
  }
  .wrap { max-width:560px; }
  .card {
    min-height:auto;
    padding:42px;
  }
  .name { font-size:64px; }
}

@media (max-width:500px) {
  body { padding:10px; }
  .card {
    min-height:calc(100dvh - 20px);
    border-radius:22px;
    padding:24px 20px 22px;
  }
  .hero { padding:34px 0 28px; }
  .name { font-size:42px; }
  .actions { grid-template-columns:1fr; }
  .action.primary { grid-column:auto; }
  .footer { margin-top:24px; }
}
</style>
</head>

async function shareCard() {
  const shareData = {
    title:'ESTGAR Studio · Ismael Osorio',
    text:'Tarjeta digital de ESTGAR Studio',
    url:window.location.href
  };

  if (navigator.share) {
    try {
      await navigator.share(shareData);
    } catch(e) {}
  } else {
    try {
      await navigator.clipboard.writeText(window.location.href);
      showToast('Enlace copiado');
    } catch(e) {
      showToast('Copia el enlace de esta tarjeta');
    }
  }
}
</script>
